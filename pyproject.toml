[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netapp"
dynamic = ["version"]
description = "NetApp ONTAP volume management CLI with Cohesity backup registration"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28,<3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
netapp = "netapp.cli:main"

[tool.setuptools]
packages = ["netapp"]

[tool.setuptools.package-data]
netapp = ["default_config.yaml"]

[tool.setuptools.dynamic]
version = {attr = "netapp.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
