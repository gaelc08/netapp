[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netapp"
dynamic = ["version"]
description = "NetApp ONTAP volume management CLI with Cohesity backup registration"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28,<3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.15,<0.16"]

[project.scripts]
netapp = "netapp.cli:main"

[tool.setuptools]
packages = ["netapp"]

[tool.setuptools.package-data]
netapp = ["default_config.yaml"]

[tool.setuptools.dynamic]
version = {attr = "netapp.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
# Pinned explicitly (ruff's default rule set changes between releases):
# syntax errors, undefined/unused names and other likely bugs, no style
# rules.
select = ["E4", "E7", "E9", "F"]
