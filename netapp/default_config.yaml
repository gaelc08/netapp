# netapp site configuration.
#
# This file ships inside the package and is used when no other config is
# found. To customize, copy it to one of these (first match wins) and edit:
#   --config <path>
#   $NETAPP_CONFIG
#   ~/.config/netapp/config.yaml
#   /etc/netapp/config.yaml
# The file you point at replaces this one entirely (no merging), so keep
# every section.
#
# Any string written as ${VAR_NAME} is read from the environment at load
# time (same convention as cos2pag). Secrets don't belong here: put them
# in a .env file instead (see .env.example).

ontap:
  # Clusters are reached as <cluster>.<domain>, for ssh and REST alike.
  domain: ctie.etat.lu

snapshot_policies:
  # Valid values for --snap-policy.
  # CTIE_Prod (from `snapshot-policy show -policy CTIE_Prod -instance` on
  # damascus-3): hourly x24, daily x31, weekly x4.
  valid:
    - CTIE_daily
    - CTIE_daily_315
    - CTIE_default
    - CTIE_heavy
    - CTIE_light
    - CTIE_medium
    - CTIE_one_weekly
    - CTIE_Prod
    - none
  # Policies restricted to one protocol by convention. ONTAP itself
  # doesn't enforce this, but picking the wrong one is a mistake worth
  # catching before a volume ever gets created with it.
  protocol_restrictions:
    CTIE_Prod: cifs

cohesity:
  # LIF addresses on this network are reserved for Cohesity backup
  # traffic and must never be handed out to clients as a mount target -
  # excluded from the client access info block.
  backup_network_prefix: "10.111.210."
  # NetApp cluster -> Cohesity cluster, and the suffix of its protection
  # job names ("<Cluster>-<Tier>Term-<job_suffix>"). For any cluster not
  # listed, pass --cohesity-cluster / --cohesity-job explicitly.
  clusters:
    damascus-3: {cohesity_cluster: closluce-1, job_suffix: DC1}
    jericho-1:  {cohesity_cluster: closluce-1, job_suffix: DC1}
    damascus-4: {cohesity_cluster: closluce-2, job_suffix: CS3}
    jericho-2:  {cohesity_cluster: closluce-2, job_suffix: CS3}
